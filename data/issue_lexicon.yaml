# feta 心理画像词表
#
# 数据与逻辑分离：本文件存"业务知识"，classifier.py 只负责"如何使用知识"。
# 改词表不需要改代码，编辑此文件即可生效。
#
# 路径：data/issue_lexicon.yaml
# 加载方：src/classifier.py (_load_lexicon, 模块级 lru_cache 缓存)
#
# 匹配规则（由 classifier._hit() 实现）：
#   - 纯 ASCII 关键词 → 按单词边界匹配（避免 fat 命中 fate），大小写不敏感
#   - 含中文的关键词 → 子串匹配（中文无空格分词）
#   - 词组（如 want to die）按连续词序列匹配
#
# ─────────────────────────────────────────────────────────────
# 语言策略（2026-09 起，主链路已切英文）
# ─────────────────────────────────────────────────────────────
# 决策：当前产品面向英文用户，风险模型与干预池均为英文语料。
#
# 词表结构：
#   - 每个 list 内部用 # zh: / # en: 注释标记语种（classifier 按字符自动分流，
#     注释只是文档/审计提示，不影响匹配逻辑）
#   - 英文词是主路径，每个 target_issue 必须有足够英文词覆盖
#   - 中文词作为可选分支保留：
#       * 给未来中文模型接入留接口（一旦训练出中文风险模型，词表立刻可用）
#       * 给开发期手工调试 / 跨语种回归测试留路径
#     **中文词不在主链路触发**，classifier 会自动跳过（见 _is_latin 检查）
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# 8 大压力源归因词表
#   key   : target_issue 枚举名（与干预池打标对齐，**禁止改名**）
#   value : 触发该归因的关键词列表（命中即累计 1 分）
#
# 当前主链路为英文（模型与干预池均为英文语料），英文词为主力；
# 中文词保留作为可选分支（详见文件顶部"语言策略"）。
# ─────────────────────────────────────────────────────────────
