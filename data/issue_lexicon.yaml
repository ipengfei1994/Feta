# ─────────────────────────────────────────────────────────────
# 自杀/自伤关键词（任意一条命中即升级为 Suicidal）
# 规则兜底用：模型可用时以模型输出为准，本表作为零特征/异常情况下的安全网
# ─────────────────────────────────────────────────────────────
suicide_keywords:
  # zh (可选分支，不在主链路触发)
  - 自杀
  - 不想活
  - 轻生
  - 结束生命
  - 活不下去
  - 解脱
  - 跳楼
  - 割腕
  # en (主链路，模型 recall 仅 0.699，规则兜底宁可假阳)
  - want to die
  - wanna die
  - kill myself
  - end my life
  - end it all
  - no reason to live
  - better off dead
  - can't go on
  - cannot go on
  - suicide
  - suicidal
  - self harm
  - hurt myself
  - take my own life
  - not want to live
  - rather be dead
  - goodbye forever
  - disappear forever
  - no point living

# ─────────────────────────────────────────────────────────────
# 风险等级判定关键词（模型不可用时的降级基线）
#   判定优先级：Suicidal > Depression > Anxiety > Normal
#   risk_level 用 NLP 同学的标准四档（Normal / Anxiety / Depression / Suicidal）
#   target_issue 沿用项目自己的 8 大类压力源（见上）
# ─────────────────────────────────────────────────────────────
risk_level_keywords:
  # 抑郁/崩溃类：情绪低、能量低、自我评价低、与睡眠问题常共病
  Depression:
    # zh (可选分支)
    - 崩溃
    - 低落
    - 孤独
    - emo
    - 抑郁
    - 难过
    - 压力大
    - 累
    - 失眠
    - 睡不着
    - 熬夜
    - 多梦
    # en (主链路)
    - depressed
    - depression
    - hopeless
    - worthless
    - empty
    - numb
    - miserable
    - insomnia
    - give up
  # 焦虑紧张类：紧张、担心、躯体紧张、烦躁
  Anxiety:
    # zh (可选分支)
    - 焦虑
    - 紧张
    - 担心
    - 害怕
    - 心慌
    - 烦躁
    # en (主链路)
    - anxious
    - anxiety
    - worried
    - worry
    - nervous
    - panic
    - scared
    - afraid
    - overwhelmed
    - stress
    - stressed

# ─────────────────────────────────────────────────────────────
# embedding_prompt 模板：每条对应一个归因，用于生成英文语义描述
#
# ⚠️ 干预池是英文语料，embedding_prompt 必须英文。实验结论：
#    中文原文直查英文池 Hit@5 会从 97.8% 掉到 13%。
#
# key 命名：与 target_issues 一致；多一个 "General" 作为零命中兜底。
# ─────────────────────────────────────────────────────────────
english_issue_prompts:
  Academic_Stress:    "Coping with exam pressure and study stress, seeking motivation and calm focus"
  Appearance_Anxiety: "Seeking self-acceptance and body confidence, coping with anxiety about looks"
  Interpersonal:      "Resolving friendship and roommate conflict, seeking communication skills and connection"
  Family:             "Coping with family tension and parents arguing, seeking emotional support"
  Financial_Stress:   "Coping with money worries and budgeting stress as a student"
  Career_Future:      "Overcoming job hunting anxiety and career uncertainty, staying hopeful about the future"
  Emotional_Health:   "Lifting low mood and emptiness, finding hope and emotional balance"
  Sleep_Disorder:     "Improving sleep quality, relaxation techniques for insomnia relief"
  General:            "Relaxation and mindfulness, gentle comfort and positive energy"
