# feta Crisis Support Playbook (tiered by risk level)
#
# Scope: English-language product surface. The Chinese version of this content
#        is deferred to a post-launch locale track and is not maintained here.
#
# Two audiences, two field groups — keep them separate:
#   user_facing.*  → rendered in the UI, addressed to the person, second person,
#                    non-clinical, non-diagnostic. Safe to show.
#   staff_actions  → operational guidance for care teams / escalation routing.
#                    Third-person clinical reading. NEVER render to the user.
#                    Keeping it out of the UI is what keeps this product a
#                    content-recommendation system and not a diagnostic tool.
#
# Loaded by: src/recommender.py (_load_crisis_playbook, lru_cache)
# Triggered: risk_level in configs/config.yaml → safety.referral_levels
#            (attached after recommendations; never blocks the feed).
#
# Verify hotline numbers against the target launch region before go-live.

tiers:
  Normal:
    urgency: 1
    user_facing:
      summary: "Nothing here suggests you're struggling right now."
      message: >
        Thanks for checking in with yourself. Small habits — regular sleep,
        movement, and keeping up with people you trust — do most of the work
        in keeping you steady. Come back any time you want something to read.
    staff_actions:
      - Maintain existing social support and positive lifestyle habits (regular sleep, exercise, socializing)
      - Provide mental-health self-help resources; encourage emotional awareness and journaling
      - Escalate attention if persistent low mood or stress expressions appear later

  Anxiety:
    urgency: 2
    user_facing:
      summary: "You sound under pressure — tense, worried, keyed up."
      message: >
        When everything feels urgent, slowing your breathing down actually
        helps — it's not a platitude, it changes the signal your body sends
        back. Below are a few things other people in the same spot found
        useful. If the pressure builds instead of easing, that's worth
        saying out loud to someone.
    staff_actions:
      - Guide relaxation training (breathing regulation, mindfulness meditation)
      - Introduce cognitive restructuring; identify and challenge catastrophic thinking
      - Suggest regular routine and moderate exercise to ease physical anxiety
      - Watch for avoidance behaviour, worsening sleep, or functional impairment

  Depression:
    urgency: 3
    user_facing:
      summary: "It sounds like things have been heavy for a while."
      message: >
        Feeling flat or empty for days on end is a sign you've been carrying
        more than you should have to alone. Talking to a professional isn't
        a last resort — it's the fastest route back to feeling like yourself.
        You don't have to have the right words first.
    staff_actions:
      - Recommend prompt professional counseling or psychiatric evaluation
      - Strengthen social support: encourage confiding in trusted friends/family; avoid prolonged isolation
      - Build behavioural activation plan (small goals, daily activities)
      - Flag warning signs: self-blame, worthlessness, marked sleep/appetite change
      - Monitor for suicidal ideation; escalate to crisis handling if it appears

  Suicidal:
    urgency: 4
    user_facing:
      summary: "What you wrote sounds like you're in real danger right now."
      message: >
        Please don't sit with this alone. If you can, tell someone physically
        near you, or call one of the lines below — they pick up 24/7 and you
        don't need to explain yourself perfectly first. If you're in immediate
        danger, please contact your local emergency number.
    staff_actions:
      - Immediate crisis intervention: stay with them, never leave alone
      - Remove accessible dangerous items and environmental risks
      - Direct referral to crisis hotline / psychiatric emergency
      - Encourage and assist contact with trusted family or friends for shared care
      - Maintain follow-up until a professional service takes over; a single conversation does not clear the risk

# ─────────────────────────────────────────────────────────────
# Stressor-specific suggestions (keys match the target_issue enum + General)
# These are shown to the user, so they stay second-person and practical.
# ─────────────────────────────────────────────────────────────
stressor_advice:
  Academic_Stress:    "Study pressure: break the workload into pieces small enough to start, and use the counselling and peer support your school already pays for."
  Appearance_Anxiety: "Body and appearance worries: try spending less time checking and more time doing things your body lets you do."
  Interpersonal:      "Friendship and social friction: fewer comparisons, and one or two people you can actually be honest with, beats a wide circle."
  Family:             "Family tension: small changes in how you raise a subject often work better than big conversations. Family counselling is an option if it keeps looping."
  Financial_Stress:   "Money worries: writing down the actual numbers usually shrinks the fear, and there may be hardship support you haven't claimed."
  Career_Future:      "Work and career uncertainty: draw a boundary around what you control this week, and get advice on the rest from someone in the field."
  Emotional_Health:   "Low mood and self-criticism: talk to yourself the way you'd talk to a friend in the same situation — it changes more than it sounds like it would."
  Sleep_Disorder:     "Sleep trouble: a fixed wake time and screens out of the last hour do more than any sleep app. Persistent insomnia is worth a clinic visit."
  General:            "Whatever it is: naming the single hardest part makes the rest easier to move."

# ─────────────────────────────────────────────────────────────
# Crisis resources (shipped with the card when urgency >= 4)
# Replace per launch region before go-live.
# ─────────────────────────────────────────────────────────────
resources:
  - name: "988 Suicide & Crisis Lifeline (US)"
    contact: "Call or text 988"
  - name: "Samaritans (UK & Ireland)"
    contact: "Call 116 123"
  - name: "Crisis Text Line (US)"
    contact: "Text HOME to 741741"
  - name: "Find a helpline in your country"
    contact: "findahelpline.com"
