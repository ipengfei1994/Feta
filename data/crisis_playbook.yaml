# feta 危机干预话术库（按风险等级分级）
#
# 来源：NLP 同学阶段 4 干预推荐引擎的规则化知识库，属领域知识而非统计结果。
# 数据与逻辑分离：本文件存话术内容，src/recommender.py 只负责按等级取用。
#
# 加载方：src/recommender.py (_load_crisis_playbook, lru_cache)
# 触发时机：risk_level 命中 configs/config.yaml 的 safety.referral_levels 时，
#           话术卡附在推荐结果后返回（不拦截推荐，双轨并行）。
#
# ⚠️ 热线号码为公开可用号码，正式上线前需二次核实有效性。

# ─────────────────────────────────────────────────────────────
# 四档风险话术（key 与 risk_level 枚举一致：Normal / Anxiety / Depression / Suicidal）
#   level    : 中文等级名
#   urgency  : 紧急度 1~4
#   summary  : 一句话状态判断（UI 默认渲染此字段）
#   actions  : 分级干预动作清单
#   monitor  : 后续监测建议
# ─────────────────────────────────────────────────────────────
tiers:
  Normal:
    level: 低风险
    urgency: 1
    summary: 文本未见明显负面情绪或风险信号，属于日常状态。
    actions:
      - 维持现有社会支持与正向生活习惯（规律作息、运动、社交）
      - 提供心理健康自助资源，鼓励情绪觉察与记录
    monitor: 若后续出现持续性情绪低落或压力表述，升级关注。

  Anxiety:
    level: 中低风险
    urgency: 2
    summary: 文本呈现焦虑、紧张、过度担忧信号，尚未达到重度。
    actions:
      - 引导放松训练（呼吸调节、正念冥想）
      - 介绍认知重构方法，识别与挑战灾难化思维
      - 建议建立规律作息与适度运动以缓解生理性焦虑
    monitor: 关注是否出现回避行为、睡眠恶化或功能受损，必要时升级。

  Depression:
    level: 中高风险
    urgency: 3
    summary: 文本呈现持续低落、兴趣丧失、无力感等抑郁信号。
    actions:
      - 建议尽快寻求专业心理咨询或精神科评估
      - 强化社会支持：鼓励向可信亲友倾诉，避免长期独处
      - 建立行为激活计划（小目标、日常活动安排）
      - 提示预警信号：自责、无价值感、睡眠/食欲显著改变
    monitor: 密切监测自杀意念相关表述，一旦触及立即升级为高危处置。

  Suicidal:
    level: 高风险(紧急)
    urgency: 4
    summary: 文本呈现明确的自杀意念、自伤计划或绝望感，需紧急处置。
    actions:
      - 立即危机干预：保持陪伴，切勿让其独处
      - 移除可及的危险物品与环境风险
      - 直接转介心理危机干预热线/精神科急诊
      - 鼓励并协助联系可信赖的家人或朋友共同照护
    monitor: 必须持续跟进直至专业机构接手，不可仅凭一次对话解除风险。

# ─────────────────────────────────────────────────────────────
# 压力源针对性补充建议（key 与 target_issue 枚举一致，多一个 General 兜底）
# ─────────────────────────────────────────────────────────────
stressor_advice:
  Academic_Stress:    针对学业压力：建议分解目标、制定复习与提交计划，善用学校心理咨询与朋辈支持。
  Appearance_Anxiety: 针对外貌与身材焦虑：建议减少对外貌的过度关注，练习身体接纳与自我关怀。
  Interpersonal:      针对人际与社交压力：建议降低过度社会比较，建立小范围高质量支持关系。
  Family:             针对家庭关系压力：建议改善沟通方式，必要时引入家庭咨询或代际沟通技巧。
  Financial_Stress:   针对经济压力：建议梳理收支与可用援助资源，缓解不确定性带来的焦虑。
  Career_Future:      针对工作与职业压力：建议厘清工作量边界与职业规划，必要时寻求职业咨询。
  Emotional_Health:   针对情绪与自我压力：建议减少自我苛责，练习自我关怀与价值澄清。
  Sleep_Disorder:     针对睡眠困扰：建议固定作息、减少睡前屏幕暴露，必要时寻求睡眠门诊评估。
  General:            针对其他生活事件压力：建议具体问题具体拆解，分阶段应对。

